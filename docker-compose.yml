# Westbridge ERP — Local development services
#
# Starts infrastructure needed to run the Westbridge backend locally:
#   - PostgreSQL (app database)
#   - Redis (sessions, caching, BullMQ job queues)
#
# ERPNext runs on ERPNext Cloud (erpnext.com) — not self-hosted.
# Set ERPNEXT_URL in .env to point to your ERPNext Cloud instance.
#
# Usage:
#   cp .env.example .env   # Fill in secrets before first run
#   docker compose up -d
#   npx prisma migrate deploy
#   npm run dev
#   # Frontend: cd ../Westbridge-ERP-1 && npm run dev

services:
  # ─── PostgreSQL (Westbridge app database) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: westbridge
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis (sessions, cache, BullMQ queues) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
