name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Security audit ──────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - name: Run tests with coverage (78% statements, 73% branches, 90% functions, 78% lines)
        run: npm test -- --coverage --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: westbridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge_test
      # The Prisma schema declares directUrl = env("MIGRATION_DATABASE_URL")
      # for the production runtime/migration role split. CI runs as a single
      # superuser so point both URLs at the same connection string.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge_test
      REDIS_URL: redis://localhost:6379
      # Tenant isolation hardening: provision the westbridge_app role and
      # use it for the RLS-enforced regression suite. The other integration
      # tests continue to use TEST_DATABASE_URL (the schema-owner URL).
      TEST_RLS_DATABASE_URL: postgresql://westbridge_app:ci-rls-password-not-for-production@localhost:5432/westbridge_test?schema=public
      # The tenant-isolation suite needs a SEPARATE schema-owner connection
      # to seed fixtures across BOTH tenants without RLS getting in the way
      # (the westbridge_app role would refuse cross-tenant INSERTs because
      # the per-row check would only allow rows belonging to the currently
      # bound app.current_account_id).
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - name: Apply RLS migrations (db push skips them)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: westbridge_test
        # `prisma db push` syncs the schema but does NOT execute migration
        # files. The RLS policies live in raw SQL migrations so we have to
        # apply them manually here. Order matters: the original migration
        # creates the role + 10 base-table policies, the cortex migration
        # adds 9 more.
        run: |
          psql -v ON_ERROR_STOP=1 -f prisma/migrations/20260318_add_row_level_security/migration.sql
          psql -v ON_ERROR_STOP=1 -f prisma/migrations/20260409060845_cortex_and_user_scoped_rls/migration.sql
      - name: Provision westbridge_app role for RLS tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: westbridge_test
          WESTBRIDGE_APP_PASSWORD: ci-rls-password-not-for-production
        run: ./scripts/provision-rls-role.sh
      - name: Run database integration tests
        # Run the existing integration suites (database + api-contract).
        # The tenant-isolation suite is excluded here and runs in its own
        # step below so it doesn't race with the cleanDatabase() calls in
        # database.integration.test.ts.
        run: npx vitest run --config vitest.integration.config.ts src/__tests__/integration/database.integration.test.ts src/__tests__/integration/api-contract.integration.test.ts --reporter=verbose
      - name: Run tenant isolation integration tests (RLS-enforced)
        # Runs in isolation against the westbridge_app role so RLS policies
        # filter rows. Sequential run + isolated step prevents the other
        # integration tests from racing on the shared test database.
        run: npx vitest run --config vitest.integration.config.ts src/__tests__/integration/tenant-isolation.integration.test.ts --reporter=verbose
      - name: Run rate limiter integration tests
        run: npx vitest run --config vitest.integration.config.ts src/lib/api/__tests__/rate-limit-tiers.test.ts --reporter=verbose

  # ── Load Tests (k6 smoke) ───────────────────────────────────────────────────
  # Runs the k6 smoke test against the built app to verify performance baselines.
  # This uses a lightweight smoke test (1 VU, 30s) to catch regressions early.
  # Informational — the server may not start without full production secrets.
  load-test:
    name: Load Test (Smoke)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: westbridge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
      PORT: "4000"
      SESSION_SECRET: ci-test-secret-not-for-production
      CSRF_SECRET: ci-test-csrf-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - name: Build application
        run: npm run build
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Start server
        run: |
          node dist/server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for server to start (up to 30s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health/live > /dev/null 2>&1; then
              echo "Server is up after ${i}s!"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::warning::Server process exited unexpectedly"
              cat /tmp/server.log
              exit 0
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:4000/api/health/live > /dev/null 2>&1; then
            echo "::warning::Server did not start within 30s"
            cat /tmp/server.log
            exit 0
          fi
      - name: Run k6 smoke test
        run: |
          k6 run load-tests/smoke.js || echo "::warning::k6 smoke test failed — see thresholds above"
        env:
          BASE_URL: http://localhost:4000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t westbridge-erp-backend:ci .
