name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-backend-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: westbridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/westbridge_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test -- --coverage
      - run: npx prisma db push --accept-data-loss
      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts src/__tests__/integration/ --reporter=verbose

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'push')
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli
      - name: Deploy to staging
        if: env.RAILWAY_TOKEN != ''
        run: railway up --detach
      - name: Verify staging health
        id: staging_health
        if: env.RAILWAY_TOKEN != ''
        run: |
          STAGING_URL="${{ vars.STAGING_URL || 'https://westbridge-api-staging.up.railway.app' }}"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf "${STAGING_URL}/api/health/live" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "Healthy after ${i} attempts"; exit 0; fi
            sleep 5
          done
          echo "::error::Health check failed after 10 attempts"
          exit 1
      - name: Rollback staging (Railway)
        if: failure() && steps.staging_health.outcome == 'failure' && env.RAILWAY_TOKEN != ''
        run: |
          echo "::warning::Rolling back staging deployment due to failed health check"
          railway rollback

  approve-production:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push'
    environment: production-approval
    steps:
      - name: Approval checkpoint
        run: echo "Production deployment approved"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, deploy-staging, approve-production]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'push')
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build
        run: npm run build
      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Railway — skip notice
        if: env.RAILWAY_TOKEN == '' && env.FLY_API_TOKEN == ''
        run: echo "::notice::Neither RAILWAY_TOKEN nor FLY_API_TOKEN configured — deployment skipped"
      - name: Setup Fly.io CLI
        if: env.FLY_API_TOKEN != '' && env.RAILWAY_TOKEN == ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != '' && env.RAILWAY_TOKEN == ''
        run: flyctl deploy --remote-only
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      - name: Verify production health
        id: prod_health
        if: env.RAILWAY_TOKEN != '' || env.FLY_API_TOKEN != ''
        run: |
          DEPLOY_URL="${{ vars.DEPLOY_URL || 'https://westbridge-api.fly.dev' }}"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf "${DEPLOY_URL}/api/health/live" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "Healthy after ${i} attempts"; exit 0; fi
            sleep 5
          done
          echo "::error::Health check failed after 10 attempts"
          exit 1
      - name: Rollback production (Railway)
        if: failure() && steps.prod_health.outcome == 'failure' && env.RAILWAY_TOKEN != ''
        run: |
          echo "::error::Rolling back production deployment due to failed health check"
          railway rollback
      - name: Rollback production (Fly.io)
        if: failure() && steps.prod_health.outcome == 'failure' && env.FLY_API_TOKEN != '' && env.RAILWAY_TOKEN == ''
        run: |
          echo "::error::Rolling back production deployment due to failed health check"
          flyctl releases rollback
